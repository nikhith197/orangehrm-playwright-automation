name: Playwright Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright Tests - Shard ${{ matrix.shard_id }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            shard_id: 1
          - shard: 2/2
            shard_id: 2

    env:
      TEST_ENV: demo
      BASE_URL: ${{ secrets.BASE_URL }}
      APP_USERNAME: ${{ secrets.APP_USERNAME }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_TIMEOUT_MS: 15000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check code style
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --shard=${{ matrix.shard }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-shard-${{ matrix.shard_id }}
          path: playwright-report/
          retention-days: 7

      - name: Upload screenshots, videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chromium-shard-${{ matrix.shard_id }}
          path: test-results/
          retention-days: 7